<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notbunnylol</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐇</text></svg>">
  <style>
    :root {
      --bg: #f7f7f9;
      --card: #ffffff;
      --text: #1c1e21;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --code-bg: #f1f2f5;
      --row-hover: #f9fafb;
      --setup-bg: #fffbea;
      --setup-border: #f0c040;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #e6e8eb;
        --muted: #9aa1ac;
        --border: #2a2e37;
        --accent: #818cf8;
        --accent-soft: #1f2136;
        --code-bg: #21242c;
        --row-hover: #1d2129;
        --setup-bg: #241f0f;
        --setup-border: #a67c14;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 48px 20px;
      -webkit-font-smoothing: antialiased;
    }

    #help {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .setup {
      background: var(--setup-bg);
      border: 1px solid var(--setup-border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 28px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .try-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .try-bar input {
      flex: 1;
      min-width: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95rem;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
    }

    .try-bar input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .try-bar button {
      font-size: 0.92rem;
      font-weight: 600;
      padding: 0 20px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    .try-bar button:hover {
      opacity: 0.9;
    }

    .try-preview {
      min-height: 1.4em;
      margin-bottom: 28px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
      color: var(--text);
      word-break: break-all;
    }

    .try-preview.muted {
      color: var(--muted);
      font-style: italic;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.88em;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .group {
      margin-bottom: 28px;
    }

    .group:last-child {
      margin-bottom: 0;
    }

    .group-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin: 0 0 8px;
    }

    .tree {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .node-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 7px 10px;
      border-radius: 8px;
      transition: background 0.12s ease;
      font-size: 0.92rem;
    }

    .node-row:hover {
      background: var(--row-hover);
    }

    .node-row .cmd {
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 600;
      flex-shrink: 0;
    }

    .node-row .url {
      color: var(--muted);
      font-size: 0.85rem;
      word-break: break-all;
      flex: 1;
      min-width: 200px;
    }

    .node-row .url.muted {
      font-style: italic;
    }

    .node-row .flags {
      color: var(--muted);
      font-size: 0.78rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      flex-shrink: 0;
    }

    .children {
      margin: 2px 0 2px 22px;
      padding-left: 16px;
      border-left: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="help" style="display: none;">
    <header>
      <h1>🐇 notbunnylol</h1>
      <p>a bunnylol-style redirector</p>
    </header>
    <div class="setup">
      Set your browser's custom search engine URL to:
      <code id="search-url"></code>
      and the keyword to anything you like (e.g. <code>go</code>).
    </div>
    <form id="try-form" class="try-bar">
      <input type="text" id="try-input" placeholder="Try it out: gh repo notbunnylol" autocomplete="off" spellcheck="false">
      <button type="submit">Go →</button>
    </form>
    <div id="try-preview" class="try-preview"></div>
    <div id="tree" class="card"></div>
    <footer>
      <a href="https://github.com/esstorm/notbunnylol">notbunnylol on GitHub</a>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
